name: deploy to ec2 practice

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: Ubuntu 26

    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: ssh connect
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ubuntu
          key: ${{secrets.SSH_KEY}}
          script: |
            cd ~/AWS
            git pull
            sudo docker compose down
            sudo docker compose up -d --build
